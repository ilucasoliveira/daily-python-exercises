input {
  kafka {
    bootstrap_servers => "kafka:19092"
    topics => ["app-logs"]
    group_id => "logstash"
    auto_offset_reset => "earliest"
    codec => json
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "app-logs"
  }
  stdout {
    codec => rubydebug
  }
}