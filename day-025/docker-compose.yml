services:
  redis:
    image: redis:8-alpine
    container_name: container-redis
    ports:
      - "6379:6379"
  app:
    build: .
    container_name: container-api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_started
    command:
      ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
